<text x="300.0" y="-1773.0" font-size="28" fill="#111">배출구측 정면</text>
<text x="504.85" y="-1191.0" font-size="22" fill="#7a3e00">52.3 ±0.4</text>
<text x="3.30000000000004" y="-1466.5" font-size="22" fill="#7a3e00">43.3 (+0.2/-0.6)</text>
<text x="926.0" y="-1668.0" font-size="20" fill="#111">팬 개구 Ø19 (참조)</text>
<text x="1150.0" y="-1773.0" font-size="28" fill="#111">측면</text>
<text x="1204.85" y="-1191.0" font-size="22" fill="#7a3e00">22.3 ±0.4</text>
<text x="864.3000000000001" y="-1316.0" font-size="22" fill="#7a3e00">측면 폭 13.2 ±0.4</text>
<text x="1476.0" y="-1553.46" font-size="20" fill="#111">커넥터 구역: ACES 51451-0060N-001</text>
<text x="1526.0" y="-1372.84" font-size="20" fill="#111">위치: 공기 배출구 인접 측면</text>
<text x="300.0" y="-973.0" font-size="28" fill="#111">배출구 반대쪽 면</text>
<text x="926.0" y="-616.5" font-size="20" fill="#111">라벨 18 x 12</text>
<text x="1150.0" y="-810.0" font-size="28" fill="#111">주기</text>
<text x="1150.0" y="-772.0" font-size="18" fill="#111">1. 공기 흡입구 위치는 데이터시트 미상이며 이 도면에 표시하지 않는다.</text>
<text x="1150.0" y="-734.0" font-size="18" fill="#111">2. 동작 권장 10 ~ 40 °C / 20 ~ 80 %RH; 절대 -10 ~ 50 °C / 0 ~ 90 %RH 비결로.</text>
<text x="1150.0" y="-696.0" font-size="18" fill="#111">3. 결로 조건에 어떤 경우에도 노출 금지.</text>
<text x="1150.0" y="-658.0" font-size="18" fill="#111">4. 시험 조건 ⑤ 목표 60 ℃는 절대 최대 50 °C 초과. 이 상태로 수행하면 소자가 손상된다.</text>
<text x="1150.0" y="-620.0" font-size="18" fill="#111">5. I2C 주소 0x69 고정. 3대는 멀티플렉서 또는 버스 분리 필요(미결정).</text>
<text x="1150.0" y="-582.0" font-size="18" fill="#111">6. 배선 10 cm 미만 권장 또는 차폐 케이블 사용.</text>
<text x="1150.0" y="-544.0" font-size="18" fill="#111">7. 금속 실드는 내부 GND와 연결되며 등전위 미확보 시 과열 위험.</text>
<text x="1150.0" y="-506.0" font-size="18" fill="#111">8. 측정 주기 1 Hz 고정.</text>
<text x="1150.0" y="-468.0" font-size="18" fill="#111">9. 팬 자동 청소 기본 1주. 전원 차단 시 카운터 리셋되므로 주 1회 수동 실행.</text>
<text x="1150.0" y="-430.0" font-size="18" fill="#111">10. 품번 SEN55-SDN-T, Article Number 3.000.593, 무게 36.4 g ±10 %.</text>
<text x="1165.0" y="-265.0" font-size="25" fill="#111">SEN55 환경 센서 모듈 상세도</text>
<text x="1165.0" y="-198.0" font-size="22" fill="#111">도면번호: J3-SN-001  REV: A</text>
<text x="1165.0" y="-130.0" font-size="22" fill="#111">축척: NTS (치수값 mm)  단위: mm  작성일: 2026-09-02</text>
